<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surgeon's Night — El Turno de Guardia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23070b14'/%3E%3Cpath d='M9 4h6v5h5v6h-5v5H9v-5H4V9h5z' fill='%23ff5d6c'/%3E%3C/svg%3E">
<style>
  :root {
    --fondo: #070b14;
    --vidrio: rgba(11, 18, 32, .74);
    --vidrio-fuerte: rgba(9, 15, 27, .9);
    --panel: #0d1524;
    --tarjeta: rgba(24, 36, 58, .72);
    --borde: rgba(132, 170, 230, .17);
    --borde-fuerte: rgba(132, 170, 230, .32);
    --tinta: #e3ecf8;
    --tenue: #8da0bd;
    --debil: #5f7292;
    --acento: #38d6e0;
    --acento-suave: rgba(56, 214, 224, .14);
    --alarma: #ff5d6c;
    --exito: #3ddc97;
    --aviso: #ffc857;
    --radio: 16px;
    --sombra: 0 14px 40px rgba(0, 0, 0, .45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--fondo); overflow: hidden; }
  body {
    color: var(--tinta);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  kbd {
    font: 700 .7em/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--tenue); background: rgba(255, 255, 255, .06);
    border: 1px solid var(--borde); border-bottom-width: 2px; border-radius: 6px;
    padding: 3px 6px; min-width: 1.9em; text-align: center;
  }
  .ico { width: 1.25em; height: 1.25em; flex: none; }

  #juego { position: fixed; inset: 0; overflow: hidden; }
  #escena3d { position: absolute; inset: 0; }
  .lienzo-3d { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  #etiquetas { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #etiquetas > * { position: absolute; left: 0; top: 0; pointer-events: auto; will-change: transform; }
  #fundido { position: absolute; inset: 0; background: #04070d; opacity: 0; pointer-events: none; transition: opacity .14s ease-out; z-index: 50; }
  #fundido.activo { opacity: 1; transition-duration: .1s; }
  #aviso-gl { display: none; position: absolute; inset: 0; z-index: 99; place-items: center; padding: 24px; text-align: center; background: var(--fondo); color: var(--tenue); }
  #aviso-gl.visible { display: grid; }
  #juego.flash-exitus::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 60;
    box-shadow: inset 0 0 160px rgba(255, 60, 80, .55); animation: flash-exitus .9s ease-out forwards;
  }
  @keyframes flash-exitus { from { opacity: 1; } to { opacity: 0; } }

  /* ── Indicadores reutilizables ── */
  .meter { display: block; height: 6px; background: rgba(255, 255, 255, .09); border-radius: 99px; overflow: hidden; }
  .meter > i { display: block; height: 100%; border-radius: 99px; background: var(--exito); transition: width .5s ease, background .3s; }
  .meter.grande { height: 9px; }
  .bien .meter > i, .meter-h.bien .meter > i, .estab.bien .meter > i { background: var(--exito); }
  .regular .meter > i, .meter-h.regular .meter > i, .estab.regular .meter > i { background: var(--aviso); }
  .critico .meter > i, .meter-h.critico .meter > i, .estab.critico .meter > i { background: var(--alarma); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .78em; font-weight: 700; background: var(--acento-suave); color: var(--acento); }
  .chip.mal { background: rgba(255, 93, 108, .16); color: var(--alarma); }

  /* ── HUD ── */
  #hud {
    display: none; position: absolute; z-index: 20; top: 12px; left: 12px; right: 140px; gap: 14px; align-items: center;
    padding: 9px 16px; border-radius: var(--radio); background: var(--vidrio); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--borde); box-shadow: var(--sombra);
  }
  #juego:not([data-vista="setup"]):not([data-vista="fin"]) #hud { display: flex; }
  .hud-marca { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hud-marca b { display: block; font-size: .8em; letter-spacing: .22em; white-space: nowrap; }
  .hud-marca small { display: block; color: var(--tenue); font-size: .75em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .cruz { width: 22px; height: 22px; fill: var(--alarma); filter: drop-shadow(0 0 7px rgba(255, 93, 108, .7)); animation: pulso-cruz 1.6s ease-in-out infinite; flex: none; }
  .hud-reloj { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; flex: 1; min-width: 160px; }
  .hud-reloj .hora { grid-row: span 2; font-size: 1.85em; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1; }
  .hud-reloj .hora.apurado { color: var(--alarma); animation: pulso-cruz 1s ease-in-out infinite; }
  .hud-reloj .resta { font-size: .78em; color: var(--tenue); white-space: nowrap; }
  .hud-reloj .progreso { height: 4px; background: rgba(255, 255, 255, .09); border-radius: 99px; overflow: hidden; }
  .hud-reloj .progreso i { display: block; height: 100%; background: linear-gradient(90deg, var(--acento), #6b8cff); border-radius: 99px; }
  .hud-recursos { display: flex; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 99px; background: var(--tarjeta); border: 1px solid var(--borde); font-size: .88em; color: var(--tenue); }
  .pill b { color: var(--tinta); font-variant-numeric: tabular-nums; }
  .pill.mal { border-color: rgba(255, 93, 108, .5); color: var(--alarma); }
  .pill.mal b { color: var(--alarma); }
  .pill.aviso { border-color: rgba(255, 200, 87, .45); }
  .hud-equipo { display: flex; gap: 12px; }
  .miembro { display: grid; gap: 4px; min-width: 96px; }
  .miembro.activo small { color: var(--acento); }
  .miembro small { font-size: .72em; color: var(--tenue); letter-spacing: .04em; }
  .meter-h { display: flex; align-items: center; gap: 7px; color: var(--tenue); }
  .meter-h .meter { flex: 1; height: 5px; }
  .meter-h .ico { width: 1em; height: 1em; }
  #botones-flotantes { position: absolute; z-index: 30; top: 12px; right: 12px; display: flex; gap: 8px; }
  #botones-flotantes button {
    display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 13px; border-radius: 12px;
    background: var(--vidrio); border: 1px solid var(--borde); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: var(--tenue); font-size: .88em; transition: border-color .15s, color .15s;
  }
  #botones-flotantes button:hover { border-color: var(--acento); color: var(--tinta); }
  #btn-sonido { padding: 0 11px; }

  /* ── Título y menús de configuración ── */
  #titulo-juego {
    display: none; position: absolute; z-index: 10; top: 6vh; left: 0; right: 0; flex-direction: column; align-items: center; text-align: center; padding: 0 16px;
    pointer-events: none; text-shadow: 0 2px 30px rgba(0, 0, 0, .7);
  }
  #juego[data-vista="setup"] #titulo-juego { display: flex; }
  #titulo-juego .cruz { width: 34px; height: 34px; margin-bottom: 12px; }
  #titulo-juego h1 {
    margin: 0; font-size: clamp(34px, 7.6vw, 86px); font-weight: 900; letter-spacing: .07em; line-height: 1; text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 20%, #9fdde8 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 24px rgba(56, 214, 224, .25));
  }
  #titulo-juego .sub { margin: 10px 0 0; font-size: clamp(12px, 2vw, 20px); letter-spacing: .5em; color: var(--acento); text-transform: uppercase; font-weight: 600; }
  #titulo-juego .lema { margin: 12px 0 0; color: var(--tenue); font-size: clamp(13px, 1.6vw, 16px); }
  .expediente { pointer-events: auto; margin-top: 18px; width: min(420px, 90vw); padding: 12px 16px; border-radius: 14px; background: var(--vidrio); border: 1px solid var(--borde); backdrop-filter: blur(12px); text-shadow: none; text-align: left; }
  .exp-fila { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: .9em; color: var(--tenue); }
  .exp-rango { color: var(--acento); font-weight: 800; letter-spacing: .04em; }
  .exp-datos { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: .78em; color: var(--tenue); flex-wrap: wrap; }
  .exp-datos span { display: inline-flex; align-items: center; gap: 5px; }
  .exp-datos .ico { width: .95em; height: .95em; }

  #juego[data-vista="setup"]:has(.taquilla) .expediente, #juego[data-vista="setup"]:has(.taquilla) .lema, #juego[data-vista="setup"]:has(.taquilla) #titulo-juego .sub { display: none; }
  #juego[data-vista="setup"]:has(.taquilla) #titulo-juego { top: 3vh; }
  #juego[data-vista="setup"]:has(.taquilla) #titulo-juego h1 { font-size: clamp(28px, 4vw, 48px); }
  #juego[data-vista="setup"]:has(.taquilla) #titulo-juego .cruz { display: none; }
  #modal {
    display: none; position: absolute; inset: 0; z-index: 40; padding: 14px; justify-content: center; align-items: flex-end;
    background: linear-gradient(to top, rgba(6, 10, 18, .94), rgba(6, 10, 18, .55) 48%, transparent 78%);
  }
  #modal.visible { display: flex; }
  #juego:not([data-vista="setup"]) #modal.visible { align-items: center; background: rgba(6, 10, 18, .55); backdrop-filter: blur(4px); }
  .modal-caja { width: min(820px, 100%); max-height: min(72vh, 680px); overflow: auto; padding: 4px; scrollbar-width: thin; scrollbar-color: var(--borde-fuerte) transparent; animation: subir .35s cubic-bezier(.2, .8, .2, 1) both; }
  .modal-caja h2 { margin: 0 0 14px; font-size: 1.15em; font-weight: 700; text-align: center; letter-spacing: .02em; }
  .chips-setup { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  .chips-setup span { padding: 3px 11px; border-radius: 99px; font-size: .78em; background: var(--acento-suave); color: var(--acento); border: 1px solid rgba(56, 214, 224, .25); }
  .opciones-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .modal-caja.compacto .opciones-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .opcion-card {
    position: relative; display: flex; align-items: center; gap: 13px; text-align: left; padding: 14px 15px; border-radius: 14px;
    background: var(--vidrio-fuerte); border: 1px solid var(--borde); backdrop-filter: blur(10px);
    transition: transform .14s, border-color .14s, box-shadow .14s, background .14s; animation: subir .4s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--d, 0ms);
  }
  .opcion-card:hover, .opcion-card:focus-visible { transform: translateY(-2px); border-color: rgba(56, 214, 224, .65); background: rgba(16, 30, 50, .94); box-shadow: 0 10px 30px rgba(0, 0, 0, .4), 0 0 26px rgba(56, 214, 224, .14); outline: none; }
  .opcion-card:active { transform: translateY(0) scale(.985); }
  .oc-ico { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; flex: none; background: var(--acento-suave); color: var(--acento); }
  .oc-ico .ico { width: 22px; height: 22px; }
  .oc-txt { display: grid; gap: 2px; min-width: 0; flex: 1; }
  .oc-txt b { font-weight: 700; font-size: .96em; }
  .oc-txt small { color: var(--tenue); font-size: .8em; line-height: 1.4; }
  .opcion-card kbd { position: absolute; top: 9px; right: 10px; opacity: .7; }
  .opcion-card.idioma { justify-content: center; padding: 16px 10px; }
  .oc-codigo { font-weight: 800; letter-spacing: .06em; color: var(--acento); font-size: 1.05em; }
  .oc-nivel { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; font-weight: 800; flex: none; background: linear-gradient(135deg, rgba(56, 214, 224, .22), rgba(91, 140, 255, .22)); color: #b8f2f6; }
  .muestra { width: 36px; height: 36px; border-radius: 50%; flex: none; border: 2px solid rgba(255, 255, 255, .25); box-shadow: inset 0 -6px 12px rgba(0, 0, 0, .2); }
  .gran-boton {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 12px; padding: 16px 22px; border-radius: 14px;
    font-weight: 800; font-size: 1.02em; letter-spacing: .03em; color: #04121a; background: linear-gradient(180deg, #7ee7ee, var(--acento));
    box-shadow: 0 10px 30px rgba(56, 214, 224, .3); transition: transform .14s, box-shadow .14s;
  }
  .gran-boton:hover { transform: translateY(-2px); box-shadow: 0 14px 38px rgba(56, 214, 224, .42); }
  .gran-boton .ico { width: 1.3em; height: 1.3em; }
  #campo-texto { width: 100%; padding: 14px 16px; border-radius: 12px; font: inherit; font-size: 1.05em; color: var(--tinta); background: var(--vidrio-fuerte); border: 1px solid var(--borde-fuerte); }
  #campo-texto:focus { outline: none; border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-suave); }
  .editor-vista { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 0 0 14px; }
  .editor-vista small { display: block; color: var(--tenue); font-size: .75em; letter-spacing: .1em; text-transform: uppercase; }
  .editor-vista b { font-size: 1.3em; }
  .editor-vista .retrato { width: 96px; height: 96px; }

  /* ── Taquilla ── */
  .taquilla { margin: 0 0 14px; padding: 12px 14px; border-radius: 14px; background: var(--vidrio-fuerte); border: 1px solid var(--borde); }
  .taq-cab { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .taq-cab b { letter-spacing: .14em; text-transform: uppercase; font-size: .82em; color: var(--acento); }
  .taq-cab span { color: var(--tenue); font-size: .82em; }
  .taq-rejilla { display: grid; gap: 7px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .taq-carta { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, .03); border: 1px solid var(--borde); }
  .taq-carta.abierta { border-color: rgba(61, 220, 151, .4); background: rgba(61, 220, 151, .07); }
  .taq-carta.cerrada { opacity: .55; }
  .taq-ico { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: rgba(255, 255, 255, .06); color: var(--tenue); flex: none; }
  .taq-carta.abierta .taq-ico { background: rgba(61, 220, 151, .16); color: var(--exito); }
  .taq-txt { display: grid; min-width: 0; flex: 1; }
  .taq-txt b { font-size: .86em; }
  .taq-txt small { color: var(--tenue); font-size: .74em; line-height: 1.3; }
  .taq-estado { font-size: .68em; font-weight: 800; letter-spacing: .08em; color: var(--debil); white-space: nowrap; }
  .taq-carta.abierta .taq-estado { color: var(--exito); }
  .taq-talisman { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; padding: 10px 12px; border-radius: 12px; background: linear-gradient(90deg, rgba(255, 200, 87, .14), transparent); border: 1px solid rgba(255, 200, 87, .4); color: var(--aviso); }
  .taq-talisman .ico { width: 26px; height: 26px; }
  .taq-talisman span { display: grid; color: var(--tinta); }
  .taq-talisman small { color: var(--aviso); font-size: .7em; letter-spacing: .12em; text-transform: uppercase; }
  .taq-talisman em { font-style: normal; color: var(--tenue); font-size: .8em; }

  /* ── Sala: riel de pacientes, dock, etiquetas ── */
  #riel { display: none; position: absolute; z-index: 15; top: 84px; left: 12px; width: 212px; flex-direction: column; gap: 7px; max-height: calc(100% - 200px); overflow: auto; scrollbar-width: none; }
  #juego[data-vista="sala"] #riel { display: flex; }
  .riel-tit { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--vidrio); border: 1px solid var(--borde); backdrop-filter: blur(12px); font-size: .82em; color: var(--tenue); }
  .riel-tit b { flex: 1; letter-spacing: .08em; text-transform: uppercase; font-size: .95em; }
  .riel-tit span { font-weight: 800; color: var(--tinta); font-variant-numeric: tabular-nums; }
  .riel-vacio { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--vidrio); border: 1px solid var(--borde); color: var(--tenue); font-size: .82em; backdrop-filter: blur(12px); }
  .riel-card { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 4px 9px; align-items: center; text-align: left; padding: 9px 11px; border-radius: 12px; background: var(--vidrio); border: 1px solid var(--borde); backdrop-filter: blur(12px); transition: transform .14s, border-color .14s; animation: entrar-izq .4s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--d, 0ms); }
  .riel-card:hover { transform: translateX(3px); border-color: rgba(56, 214, 224, .6); }
  .riel-card kbd { grid-row: span 2; }
  .riel-card .rc-txt { display: grid; min-width: 0; }
  .riel-card b { font-size: .9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .riel-card small { color: var(--tenue); font-size: .72em; }
  .riel-card .meter { grid-column: 1 / -1; }
  .riel-card.critico { border-color: rgba(255, 93, 108, .55); animation: entrar-izq .4s both, latido-alerta 1.3s ease-in-out infinite .4s; }
  .riel-card.alerta small { color: var(--aviso); }
  .riel-planta { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: .78em; color: var(--tenue); }
  #dock { display: none; position: absolute; z-index: 15; left: 50%; bottom: 16px; transform: translateX(-50%); gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 24px); }
  #dock.visible { display: flex; }
  #juego:not([data-vista="sala"]) #dock { display: none; }
  .dock-btn { display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 12px; border-radius: 14px; background: var(--vidrio); border: 1px solid var(--borde); backdrop-filter: blur(14px); transition: transform .14s, border-color .14s, box-shadow .14s; }
  .dock-btn:hover { transform: translateY(-2px); border-color: rgba(56, 214, 224, .6); box-shadow: 0 10px 28px rgba(0, 0, 0, .4); }
  .dock-btn > .ico { width: 24px; height: 24px; color: var(--acento); }
  .dock-btn span { display: grid; text-align: left; }
  .dock-btn b { font-size: .9em; }
  .dock-btn small { color: var(--tenue); font-size: .74em; }
  .dock-ayuda { width: 100%; text-align: center; font-size: .74em; color: var(--debil); text-shadow: 0 1px 8px #000; }
  #prompt { display: none; position: absolute; z-index: 16; left: 0; right: 0; margin: 0 auto; width: max-content; bottom: 98px; padding: 8px 16px; border-radius: 99px; background: var(--vidrio-fuerte); border: 1px solid var(--acento); color: var(--tinta); font-size: .9em; white-space: nowrap; animation: subir .25s both; }
  #prompt.visible { display: flex; align-items: center; gap: 9px; }
  @media (pointer: coarse) { #prompt { display: none !important; } }

  .etq-pac { display: grid; gap: 3px; min-width: 76px; padding: 5px 10px 6px; border-radius: 10px; text-align: center; background: var(--vidrio); border: 1px solid var(--borde); backdrop-filter: blur(8px); transition: border-color .15s, box-shadow .15s; font-size: 12px; }
  .etq-pac .n { font-weight: 700; white-space: nowrap; }
  .etq-pac .b { display: block; height: 4px; background: rgba(255, 255, 255, .1); border-radius: 99px; overflow: hidden; }
  .etq-pac .b i { display: block; height: 100%; background: var(--exito); border-radius: 99px; }
  .etq-pac.regular .b i { background: var(--aviso); }
  .etq-pac.critico { border-color: rgba(255, 93, 108, .65); }
  .etq-pac.critico .b i { background: var(--alarma); }
  .etq-pac.alerta .n { color: var(--aviso); }
  .etq-pac.activa { cursor: pointer; border-color: rgba(56, 214, 224, .7); box-shadow: 0 0 0 1px rgba(56, 214, 224, .3), 0 0 22px rgba(56, 214, 224, .3); }
  .etq-pac.activa:hover { transform: translate(var(--tx, 0), var(--ty, 0)) scale(1.06); }
  .etq-accion { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--vidrio-fuerte); border: 1px solid rgba(56, 214, 224, .55); color: var(--tinta); box-shadow: 0 0 20px rgba(56, 214, 224, .22); backdrop-filter: blur(8px); animation: flotar 2.4s ease-in-out infinite; white-space: nowrap; }
  .etq-accion .ico { width: 15px; height: 15px; color: var(--acento); }
  .etq-accion:hover { background: rgba(16, 36, 56, .96); }

  /* ── Paneles de juego ── */
  .panel, #panel-tecnicas, #panel-imv { display: none; }
  .panel { position: absolute; z-index: 18; top: 84px; bottom: 12px; overflow: auto; padding: 16px; border-radius: 18px; background: var(--vidrio); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--borde); box-shadow: var(--sombra); scrollbar-width: thin; scrollbar-color: var(--borde-fuerte) transparent; }
  .panel.visible { display: block; animation: entrar-izq .4s cubic-bezier(.2, .8, .2, 1) both; }
  #panel-ficha.visible { animation-name: entrar-der; }
  #panel-acciones { left: 12px; width: 380px; }
  #panel-ficha { right: 12px; width: 430px; }
  #panel-cirugia { left: 12px; width: 426px; bottom: 244px; }
  #juego:not([data-vista="paciente"]) #panel-acciones, #juego:not([data-vista="paciente"]) #panel-ficha { display: none; }
  #juego:not([data-vista="quirofano"]) #panel-cirugia, #juego:not([data-vista="quirofano"]) #panel-tecnicas, #juego:not([data-vista="quirofano"]) #resultado-q { display: none; }
  #juego:not([data-vista="puerta"]) #panel-imv { display: none; }
  .panel h2, .panel h3, .panel h4 { margin: 0; }
  .panel h4 { font-size: .72em; letter-spacing: .16em; text-transform: uppercase; color: var(--tenue); margin-bottom: 8px; }

  /* Acciones del paciente */
  .acc-cab { margin-bottom: 12px; }
  .acc-cab small { color: var(--acento); font-size: .72em; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; }
  .acc-cab h3 { font-size: 1.3em; }
  .acc-grupo { margin-bottom: 14px; }
  .acc-lista { display: grid; gap: 6px; }
  .acc-grupo.decidir .acc-lista { grid-template-columns: 1fr 1fr; }
  .acc { position: relative; display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 12px; background: var(--tarjeta); border: 1px solid var(--borde); transition: transform .12s, border-color .12s, background .12s; }
  .acc:hover, .acc:focus-visible { transform: translateX(2px); border-color: rgba(56, 214, 224, .6); background: rgba(22, 40, 64, .85); }
  .acc > .ico { width: 20px; height: 20px; color: var(--acento); }
  .acc span { flex: 1; font-size: .9em; line-height: 1.25; }
  .acc em { font-style: normal; font-size: .74em; color: var(--tenue); background: rgba(255, 255, 255, .06); padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
  .acc kbd { display: none; }
  .acc-grupo.decidir .acc { flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; }
  .acc-grupo.decidir .acc span { font-weight: 700; font-size: .84em; }
  .acc.alta > .ico { color: var(--exito); } .acc.alta:hover { border-color: var(--exito); }
  .acc.ingreso > .ico { color: var(--aviso); } .acc.ingreso:hover { border-color: var(--aviso); }
  .acc.cirugia { background: rgba(255, 93, 108, .12); border-color: rgba(255, 93, 108, .4); }
  .acc.cirugia > .ico { color: var(--alarma); } .acc.cirugia:hover { border-color: var(--alarma); background: rgba(255, 93, 108, .2); }
  .acc.derivar > .ico { color: #7aa8ff; } .acc.derivar:hover { border-color: #7aa8ff; }
  .acc-extra { margin-top: 4px; }
  .acc.volver { opacity: .75; }

  /* Historia clínica */
  .fc-cab { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .fc-retrato { flex: none; }
  .fc-retrato .retrato { width: 96px; height: 96px; border-radius: 14px; }
  .fc-id { min-width: 0; flex: 1; }
  .fc-id small { color: var(--acento); font-size: .7em; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
  .fc-id h2 { font-size: 1.45em; line-height: 1.15; }
  .fc-id p { margin: 2px 0 8px; color: var(--tenue); font-size: .86em; }
  .estab { display: grid; grid-template-columns: auto 1fr auto; gap: 9px; align-items: center; font-size: .78em; color: var(--tenue); }
  .estab b { color: var(--tinta); font-variant-numeric: tabular-nums; }
  .panel section { margin-bottom: 14px; }
  .fc-queja { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .fc-cuerpo .ficha-cuerpo { padding: 6px 10px; }
  .fc-cuerpo .cuerpo-pie { display: none; }
  .fc-queja .bocadillo { margin: 0; flex: 1; font-size: .86em; }
  .vitales { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .vital { display: grid; justify-items: center; padding: 8px 4px; border-radius: 11px; background: var(--tarjeta); border: 1px solid var(--borde); }
  .vital small { font-size: .64em; color: var(--tenue); letter-spacing: .1em; text-transform: uppercase; }
  .vital b { font-size: 1.15em; font-variant-numeric: tabular-nums; }
  .vital em { font-style: normal; font-size: .62em; color: var(--debil); }
  .vital.aviso { border-color: rgba(255, 200, 87, .5); } .vital.aviso b { color: var(--aviso); }
  .vital.mal { border-color: rgba(255, 93, 108, .6); background: rgba(255, 93, 108, .1); } .vital.mal b { color: var(--alarma); }
  .fc-lista { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .fc-lista li { position: relative; padding-left: 16px; font-size: .9em; }
  .fc-lista li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--acento); }
  .fc-texto { margin: 0; font-size: .9em; }
  .fc-notas p { display: flex; gap: 9px; margin: 0 0 6px; padding: 9px 11px; border-radius: 11px; font-size: .84em; background: rgba(255, 200, 87, .1); border: 1px solid rgba(255, 200, 87, .35); color: #ffe3a3; }
  .fc-notas .ico { color: var(--aviso); margin-top: 2px; }
  .fc-pruebas { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .prueba { display: flex; gap: 11px; padding: 10px 12px; border-radius: 12px; background: var(--tarjeta); border: 1px solid var(--borde); }
  .prueba > .ico { width: 22px; height: 22px; color: var(--acento); margin-top: 2px; }
  .prueba b { font-size: .86em; }
  .prueba p { margin: 2px 0 0; font-size: .84em; color: #c6d4e8; line-height: 1.45; }
  .prueba.nueva { animation: nueva-prueba 1.6s ease-out; border-color: var(--acento); }
  .fc-dx { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: linear-gradient(90deg, rgba(61, 220, 151, .18), rgba(61, 220, 151, .05)); border: 1px solid rgba(61, 220, 151, .5); animation: subir .4s both; }
  .fc-dx > .ico { width: 26px; height: 26px; color: var(--exito); }
  .fc-dx div { flex: 1; } .fc-dx small { display: block; font-size: .68em; letter-spacing: .14em; text-transform: uppercase; color: var(--exito); }
  .fc-dx b { font-size: .95em; }
  .cie { font: 700 .72em ui-monospace, Menlo, monospace; padding: 4px 9px; border-radius: 8px; background: rgba(255, 255, 255, .08); color: var(--tinta); white-space: nowrap; }

  /* Cirugía */
  .cir-cab small { color: var(--alarma); font-size: .72em; letter-spacing: .18em; font-weight: 800; }
  .cir-cab h3 { font-size: 1.25em; margin: 2px 0; }
  .cir-cab p { margin: 0 0 12px; color: var(--tenue); font-size: .86em; }
  .cir-pasos { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; font-size: .8em; color: var(--tenue); }
  .puntos { display: flex; gap: 5px; }

  .puntos i.hecho { background: var(--exito); }
  .puntos i.ahora { background: var(--acento); box-shadow: 0 0 10px var(--acento); }
  .cir-titulo { font-size: 1.05em; margin: 0 0 4px; }
  .cir-titulo.mal, .cir-evento.mal { color: #ff9aa5; }
  .cir-evento { margin: 0 0 12px; font-size: .92em; padding: 10px 12px; border-radius: 12px; background: var(--tarjeta); border-left: 3px solid var(--aviso); }
  .cir-evento.mal { border-left-color: var(--alarma); background: rgba(255, 93, 108, .1); }
  .cir-esquema { margin-top: 12px; border-radius: 14px; background: rgba(6, 12, 22, .6); border: 1px solid var(--borde); padding: 6px; }
  #panel-tecnicas { position: absolute; z-index: 18; left: 12px; right: 12px; bottom: 12px; }
  #panel-tecnicas.visible { display: block; animation: subir .4s cubic-bezier(.2, .8, .2, 1) both; }
  #panel-tecnicas h4 { margin: 0 0 8px 4px; font-size: .74em; letter-spacing: .16em; text-transform: uppercase; color: var(--tenue); text-shadow: 0 1px 8px #000; }
  .t-fila { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .tecnica { position: relative; display: flex; gap: 12px; align-items: center; text-align: left; padding: 13px 14px; border-radius: 14px; background: var(--vidrio-fuerte); border: 1px solid var(--borde); backdrop-filter: blur(14px); transition: transform .14s, border-color .14s, box-shadow .14s; animation: subir .4s both; animation-delay: var(--d, 0ms); min-height: 82px; }
  .tecnica:hover, .tecnica:focus-visible { transform: translateY(-3px); border-color: rgba(56, 214, 224, .7); box-shadow: 0 12px 30px rgba(0, 0, 0, .45), 0 0 26px rgba(56, 214, 224, .14); }
  .t-icono { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; flex: none; background: rgba(185, 203, 220, .08); }

  .tecnica.adjunto { border-style: dashed; }
  .tecnica.adjunto .t-icono { background: var(--acento-suave); color: var(--acento); }
  .t-feedback { margin-bottom: 10px; padding: 9px 14px; border-radius: 12px; background: var(--vidrio-fuerte); border: 1px solid var(--borde); font-size: .85em; }
  .t-feedback p { margin: 2px 0; }
  #resultado-q { display: none; position: absolute; z-index: 25; top: 84px; left: 0; right: 0; margin: 0 auto; width: min(560px, calc(100% - 24px)); gap: 12px; align-items: center; padding: 12px 18px; border-radius: 14px; font-size: .95em; background: var(--vidrio-fuerte); backdrop-filter: blur(14px); border: 1px solid var(--borde); box-shadow: var(--sombra); }
  #resultado-q.visible { display: flex; animation: bajar .35s cubic-bezier(.2, .8, .2, 1) both; }
  #resultado-q.ok { border-color: rgba(61, 220, 151, .55); } #resultado-q.ok .r-ico { color: var(--exito); }
  #resultado-q.mal { border-color: rgba(255, 93, 108, .65); background: rgba(40, 10, 18, .92); } #resultado-q.mal .r-ico { color: var(--alarma); }
  .r-ico .ico { width: 24px; height: 24px; }

  /* IMV */
  #panel-imv { position: absolute; z-index: 18; left: 0; right: 0; margin: 0 auto; bottom: 12px; width: min(900px, calc(100% - 24px)); padding: 14px; border-radius: 18px; background: var(--vidrio); backdrop-filter: blur(16px); border: 1px solid rgba(255, 93, 108, .45); box-shadow: var(--sombra), 0 0 40px rgba(255, 93, 108, .12); }

  .imv-tags { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tag { position: relative; display: grid; gap: 3px; text-align: left; padding: 14px; border-radius: 14px; border: 1px solid transparent; transition: transform .14s, box-shadow .14s; min-height: 84px; }
  .tag b { font-size: .92em; letter-spacing: .05em; } .tag small { font-size: .74em; opacity: .85; line-height: 1.3; }
  .tag kbd { position: absolute; top: 8px; right: 9px; background: rgba(0, 0, 0, .25); border-color: rgba(0, 0, 0, .3); color: inherit; }
  .tag:hover { transform: translateY(-3px); }
  .tag.rojo { background: linear-gradient(160deg, #ff4d5e, #b81f33); box-shadow: 0 8px 26px rgba(255, 60, 80, .3); }
  .tag.amarillo { background: linear-gradient(160deg, #ffd050, #c79411); color: #2a1e00; box-shadow: 0 8px 26px rgba(255, 200, 60, .25); }
  .tag.verde { background: linear-gradient(160deg, #37d98a, #1c8a55); color: #04200f; box-shadow: 0 8px 26px rgba(50, 210, 120, .25); }
  .tag.negro { background: linear-gradient(160deg, #2a2d38, #0e1017); border-color: rgba(255, 255, 255, .18); box-shadow: 0 8px 26px rgba(0, 0, 0, .5); }

  /* Resolución de un caso */
  #resolucion { display: none; position: absolute; inset: 0; z-index: 42; align-items: flex-end; justify-content: center; padding: 14px; background: linear-gradient(to top, rgba(6, 10, 18, .7), transparent 60%); }
  #resolucion.visible { display: flex; }
  .res-caja { width: min(640px, 100%); max-height: 78vh; overflow: auto; padding: 20px 22px; border-radius: 20px; background: var(--vidrio-fuerte); backdrop-filter: blur(18px); border: 1px solid var(--borde-fuerte); box-shadow: var(--sombra); animation: subir .45s cubic-bezier(.2, .8, .2, 1) both; scrollbar-width: thin; }
  .res-kicker { font-size: .72em; letter-spacing: .2em; text-transform: uppercase; color: var(--acento); font-weight: 800; }
  .res-cuerpo { margin: 10px 0 4px; display: grid; gap: 4px; }

  .res-estrellas { display: flex; align-items: center; gap: 4px; margin: 10px 0; }
  .res-estrellas span { color: rgba(255, 255, 255, .15); }
  .res-estrellas span.on { color: var(--aviso); filter: drop-shadow(0 0 8px rgba(255, 200, 87, .6)); animation: pop .5s both; }
  .res-estrellas .ico { width: 30px; height: 30px; fill: currentColor; }
  .res-estrellas small { margin-left: 10px; color: var(--tenue); font-size: .76em; letter-spacing: .1em; text-transform: uppercase; }
  .res-perla { margin: 10px 0 4px; padding: 12px 14px; border-radius: 12px; font-size: .88em; color: #c9d7ea; background: var(--acento-suave); border-left: 3px solid var(--acento); }
  .res-perla small { display: block; color: var(--acento); font-size: .72em; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; margin-bottom: 3px; }

  /* Toasts */
  #toasts { position: absolute; z-index: 45; top: 84px; left: 50%; transform: translateX(-50%); width: min(520px, calc(100% - 24px)); display: grid; gap: 8px; pointer-events: none; }

  /* Diario */
  #diario { position: absolute; z-index: 70; top: 0; right: 0; bottom: 0; width: min(400px, 92vw); transform: translateX(105%); transition: transform .3s cubic-bezier(.2, .8, .2, 1); display: flex; flex-direction: column; background: var(--vidrio-fuerte); backdrop-filter: blur(20px); border-left: 1px solid var(--borde-fuerte); }

  #diario header button { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; color: var(--tenue); } #diario header button:hover { background: rgba(255, 255, 255, .07); }
  #diario-lineas { flex: 1; overflow: auto; padding: 12px 16px; font-size: .82em; scrollbar-width: thin; }
  .dl { padding: 3px 0; color: #b8c7dc; border-bottom: 1px solid rgba(255, 255, 255, .04); }

  /* Parte final */
  #informe { display: none; position: absolute; inset: 0; z-index: 44; overflow: auto; padding: 28px 16px 60px; background: rgba(6, 10, 18, .66); backdrop-filter: blur(10px); }
  #informe.visible { display: block; }
  .inf-wrap { width: min(1080px, 100%); margin: 0 auto; display: grid; gap: 16px; animation: subir .6s cubic-bezier(.2, .8, .2, 1) both; }
  .inf-cab { text-align: center; }

  .inf-puntos { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; padding: 22px 26px; border-radius: 22px; background: var(--vidrio-fuerte); border: 1px solid var(--borde-fuerte); }

  .gran-puntos.ok b { color: var(--exito); text-shadow: 0 0 40px rgba(61, 220, 151, .35); }
  .gran-puntos.mal b { color: var(--alarma); text-shadow: 0 0 40px rgba(255, 93, 108, .35); }
  .inf-verdicto { margin: 0; font-size: clamp(16px, 2.2vw, 22px); line-height: 1.4; font-style: italic; }

  .inf-notas { margin: 0; padding: 0; list-style: none; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .inf-notas li { padding: 5px 13px; border-radius: 99px; font-size: .8em; color: var(--aviso); background: rgba(255, 200, 87, .1); border: 1px solid rgba(255, 200, 87, .3); }
  .inf-cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(440px, 100%), 1fr)); }
  .inf-card { padding: 18px 20px; border-radius: 20px; background: var(--vidrio-fuerte); border: 1px solid var(--borde); }
  .inf-card h3 { margin: 0 0 12px; font-size: .74em; letter-spacing: .18em; text-transform: uppercase; color: var(--tenue); }

  .inf-pacientes li.ok { border-left-color: var(--exito); } .inf-pacientes li.aviso { border-left-color: var(--aviso); } .inf-pacientes li.mal { border-left-color: var(--alarma); } .inf-pacientes li.info { border-left-color: #7aa8ff; }
  .inf-pacientes b { display: block; font-size: .92em; } .inf-pacientes small { color: var(--tenue); font-size: .76em; } .inf-pacientes em { font-style: normal; font-family: ui-monospace, Menlo, monospace; color: var(--debil); }
  .destino { font-size: .72em; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: rgba(255, 255, 255, .07); white-space: nowrap; }
  .destino.ok { color: var(--exito); } .destino.aviso { color: var(--aviso); } .destino.mal { color: var(--alarma); } .destino.info { color: #7aa8ff; }
  .estrellas { color: var(--aviso); letter-spacing: 1px; font-size: .9em; } .estrellas i { font-style: normal; color: rgba(255, 255, 255, .13); }
  .inf-balance { margin: 0; display: grid; gap: 5px; }

  .inf-balance dt { color: var(--tenue); } .inf-balance dd { margin: 0; font-weight: 700; }
  .inf-balance .ok dd { color: var(--exito); } .inf-balance .mal dd { color: var(--alarma); } .inf-balance .aviso dd { color: var(--aviso); }

cografía sigue siendo la prueba de elección."},deterioroPorHora:3,estabilidadInicial:[70,85],manejoCorrecto:"cirugia",notaDocente:"La ecografía es la prueba de elección. En colecistitis de <72 h de evolución, la colecistectomía laparoscópica precoz es el tratamiento estándar (Tokyo Guidelines).",cirugia:{nombre:"Colecistectomía laparoscópica",duracionMin:90,pasos:[{titulo:"Exposición del triángulo de Calot",evento:"Adherencias firmes del epiplón y el duodeno a la vesícula inflamada.",opciones:[{texto:"Disección roma y paciente pegada a la pared vesicular hasta lograr la visión crítica de seguridad",correcta:!0,resultado:"Liberas las adherencias sin lesionar nada. Visión crítica conseguida.",deltaEstabilidad:0,deltaEstres:-3},{texto:"Sección rápida con tijera de las bandas sin identificar estructuras",correcta:!1,resultado:"Lesión serosa duodenal que obliga a sutura. La confianza no sustituye a la anatomía.",deltaEstabilidad:-14,deltaEstres:12},{texto:'Tirar con fuerza de la vesícula con el grasper para "despegar" en bloque',correcta:!1,resultado:"Desgarro vesicular con salida de bilis purulenta y sangrado del lecho.",deltaEstabilidad:-10,deltaEstres:8}]},{titulo:"Control del pedículo",evento:"¡Sangrado activo de la arteria cística! El campo se tiñe de rojo en segundos.",opciones:[{texto:"Compresión con gasa, aspirar, exponer y clipar el muñón bajo visión directa",correcta:!0,resultado:"Vaso controlado con dos clips. Recuperas la calma y el campo.",deltaEstabilidad:-3,deltaEstres:4},{texto:"Clips a ciegas en medio del charco de sangre",correcta:!1,resultado:"Uno de los clips pinza parcialmente la vía biliar. Hay que retirarlo y revisar: la lesión de vía biliar es la complicación más temida.",deltaEstabilidad:-18,deltaEstres:18},{texto:"Convertir inmediatamente a cirugía abierta sin intentar el control laparoscópico",correcta:!1,resultado:"Conversión precipitada: el sangrado era controlable. Más morbilidad para el paciente.",deltaEstabilidad:-8,deltaEstres:6}]},{titulo:"Extracción de la pieza",evento:"La vesícula se perfora al despegarla del lecho: salen bilis y varios cálculos a la cavidad.",opciones:[{texto:"Aspirar la bilis, recuperar todos los cálculos y extraer la pieza en bolsa",correcta:!0,resultado:"Cavidad limpia, pieza extraída en bolsa sin contaminar la pared.",deltaEstabilidad:0,deltaEstres:-2},{texto:'Dejar los cálculos: "son estériles, no pasa nada"',correcta:!1,resultado:"Los cálculos abandonados causan abscesos tardíos. Mala praxis conocida.",deltaEstabilidad:-10,deltaEstres:6}]}]}},{id:"obstruccion",cie10:"K56.52",nombre:"Obstrucción intestinal por bridas (estrangulada)",quirurgica:!0,frecuencia:7,presentacion:{sintomas:["Dolor abdominal cólico que se ha vuelto continuo en las últimas horas","Vómitos biliosos y distensión abdominal","Ausencia de tránsito para gases y heces desde hace 36 h"],exploracion:"Abdomen distendido y timpánico, cicatriz de laparotomía previa. Dolor fijo en mesogastrio con defensa. Ruidos metálicos.",constantes:"TA 110/70, FC 108, Sat 96%, Tª 37,6 °C"},pruebaDiana:"tc",hallazgoDiana:"TC: dilatación de asas de delgado con punto de transición brusco, asa cerrada con edema de pared, líquido libre y pobre realce mural. Sospecha de estrangulación.",hallazgosParciales:{analitica:"Leucocitosis 13.800. Lactato 2,8 mmol/L: sugiere sufrimiento de asa.",eco:"Ecografía: asas dilatadas con contenido líquido. Estudio limitado por gas."},deterioroPorHora:6,estabilidadInicial:[55,75],manejoCorrecto:"cirugia",notaDocente:"La obstrucción por bridas sin signos de sufrimiento puede manejarse con SNG y observación, pero el dolor continuo, la defensa, el lactato elevado y el pobre realce mural en TC obligan a cirugía urgente.",cirugia:{nombre:"Laparotomía + adhesiolisis",duracionMin:110,pasos:[{titulo:"Adhesiolisis",evento:"Encuentras una brida firme que estrangula un asa de íleon a 60 cm de la válvula ileocecal.",opciones:[{texto:"Sección de la brida sobre tejido seguro y liberación cuidadosa del asa",correcta:!0,resultado:"Asa liberada. Ahora toca valorar su viabilidad.",deltaEstabilidad:0,deltaEstres:-2},{texto:"Tracción enérgica del asa para liberarla sin seccionar la brida",correcta:!1,resultado:"Desgarro de la serosa con apertura de la luz: contaminación del campo.",deltaEstabilidad:-15,deltaEstres:12}]},{titulo:"Valoración de la viabilidad del asa",evento:"El asa liberada está violácea, con peristaltismo dudoso.",opciones:[{texto:"Envolverla en compresas con suero caliente y reevaluar color, peristaltismo y pulso mesentérico a los 10 minutos",correcta:!0,resultado:"El asa recupera color rosado y peristaltismo en dos tercios; solo un segmento corto queda desvitalizado.",deltaEstabilidad:0,deltaEstres:-3},{texto:"Reintroducirla en la cavidad sin comprobar viabilidad y cerrar",correcta:!1,resultado:"Dejas intestino necrótico dentro: peritonitis postoperatoria casi segura.",deltaEstabilidad:-25,deltaEstres:15},{texto:"Resección amplia inmediata de todo el segmento dudoso sin reevaluar",correcta:!1,resultado:"Resecas 80 cm de intestino que habría sobrevivido. Cirugía más larga y anastomosis mayor.",deltaEstabilidad:-8,deltaEstres:5}]},{titulo:"Reconstrucción",evento:"Queda un segmento corto claramente necrótico. El paciente está estable.",opciones:[{texto:"Resección segmentaria y anastomosis primaria término-terminal",correcta:!0,resultado:"Anastomosis bien vascularizada y sin tensión. Cierre por planos.",deltaEstabilidad:0,deltaEstres:-2},{texto:'Ileostomía terminal "por seguridad" pese a la estabilidad del paciente',correcta:!1,resultado:"Estoma innecesario en paciente estable: morbilidad y segunda cirugía evitables.",deltaEstabilidad:-6,deltaEstres:4}]}]}},{id:"diverticulitis",cie10:"K57.20",nombre:"Diverticulitis aguda perforada (Hinchey IV)",quirurgica:!0,frecuencia:6,presentacion:{sintomas:["Dolor intenso en fosa ilíaca izquierda de 48 h, ahora generalizado","Fiebre de 38,9 °C y malestar general intenso",'Episodios previos de "diverticulitis" tratados con antibióticos'],exploracion:"Abdomen en tabla, defensa generalizada con signos de irritación peritoneal difusa.",constantes:"TA 95/60, FC 118, Sat 95%, Tª 38,9 °C"},pruebaDiana:"tc",hallazgoDiana:"TC: engrosamiento de sigma con divertículos, neumoperitoneo franco y líquido libre difuso con burbujas extraluminales. Perforación diverticular con peritonitis difusa (Hinchey IV).",hallazgosParciales:{analitica:"Leucocitosis 19.400 con desviación izquierda. PCR 280 mg/L. Lactato 3,1 mmol/L.",eco:"Ecografía: líquido libre en varios cuadrantes. No permite filiar el origen."},deterioroPorHora:7,estabilidadInicial:[45,65],manejoCorrecto:"cirugia",notaDocente:"La diverticulitis Hinchey I-II se maneja con antibióticos ± drenaje percutáneo, pero la peritonitis difusa (III-IV) exige cirugía urgente; en el paciente séptico e inestable, la intervención de Hartmann sigue siendo la opción más segura.",cirugia:{nombre:"Laparotomía urgente por peritonitis",duracionMin:130,pasos:[{titulo:"Entrada y control de la contaminación",evento:"Al abrir encuentras peritonitis fecaloidea difusa en los cuatro cuadrantes.",opciones:[{texto:"Aspirado del contenido y lavado abundante con suero caliente por cuadrantes",correcta:!0,resultado:"Cavidad progresivamente limpia. Identificas la perforación en sigma.",deltaEstabilidad:0,deltaEstres:-2},{texto:"Ir directo al sigma sin lavar primero la cavidad",correcta:!1,resultado:"Trabajas en un campo sucio: mayor carga séptica y peor visión.",deltaEstabilidad:-10,deltaEstres:8}]},{titulo:"Inestabilidad intraoperatoria",evento:"Anestesia avisa: TA 78/45 pese a fluidos, precisa noradrenalina. El paciente está séptico.",opciones:[{texto:"Pausa quirúrgica coordinada: optimizar con anestesia y cambiar a estrategia de control de daños",correcta:!0,resultado:"El paciente se estabiliza parcialmente. Acortas el plan quirúrgico: primero salvar la vida.",deltaEstabilidad:5,deltaEstres:4},{texto:'Seguir operando a ritmo normal: "cuanto antes acabemos, mejor"',correcta:!1,resultado:"Hipotensión mantenida durante 20 minutos: daño orgánico añadido.",deltaEstabilidad:-18,deltaEstres:12}]},{titulo:"Decisión reconstructiva",evento:"Sigma perforado resecado. Paciente séptico con noradrenalina en curso.",opciones:[{texto:"Intervención de Hartmann: colostomía terminal y cierre del muñón rectal",correcta:!0,resultado:"Opción segura en el paciente inestable. Fin de la cirugía sin anastomosis de riesgo.",deltaEstabilidad:0,deltaEstres:-3},{texto:'Anastomosis colorrectal primaria para "ahorrarle el estoma"',correcta:!1,resultado:"Anastomosis en paciente séptico e inestable: riesgo altísimo de dehiscencia.",deltaEstabilidad:-20,deltaEstres:10}]}]}},{id:"isquemia",cie10:"K55.019",nombre:"Isquemia mesentérica aguda (embolia de AMS)",quirurgica:!0,frecuencia:4,presentacion:{sintomas:["Dolor abdominal brutal de inicio súbito hace 3 h","El dolor es desproporcionado respecto a la exploración","Antecedente de fibrilación auricular sin anticoagular"],exploracion:"Abdomen blando y poco doloroso a la palpación pese al dolor referido. Arritmia a la auscultación.",constantes:"TA 105/65, FC 122 irregular, Sat 96%, Tª 36,9 °C"},pruebaDiana:"angiotc",hallazgoDiana:"Angio-TC: defecto de repleción en la arteria mesentérica superior a 4 cm del ostium compatible con embolia. Asas de delgado con hipocaptación parietal. Isquemia mesentérica aguda.",hallazgosParciales:{analitica:"Lactato 4,9 mmol/L, leucocitosis 17.000, acidosis metabólica incipiente. ¡Piensa en isquemia!",gasometria:"Gasometría: pH 7,29 con lactato 4,7 mmol/L. Acidosis láctica en un abdomen blando: isquemia hasta demostrar lo contrario.",tc:"TC sin fase arterial dedicada: asas de calibre normal con pared adelgazada. Estudio subóptimo para valorar la AMS.",eco:"Ecografía: escaso líquido libre. No valorable el eje mesentérico.",ecg:"ECG: fibrilación auricular con respuesta ventricular rápida. Ahí tienes la fábrica de émbolos."},deterioroPorHora:12,estabilidadInicial:[50,65],manejoCorrecto:"cirugia",notaDocente:'"Dolor desproporcionado a la exploración + FA" es isquemia mesentérica hasta que se demuestre lo contrario. El angio-TC es la prueba de elección y cada hora de retraso multiplica la mortalidad.',cirugia:{nombre:"Laparotomía + revascularización de la AMS",duracionMin:140,pasos:[{titulo:"Exploración de la cavidad",evento:"Asas de yeyuno-íleon cianóticas en un segmento extenso; el colon derecho tiene aspecto dudoso.",opciones:[{texto:"Priorizar la revascularización: exponer la AMS y realizar embolectomía con catéter de Fogarty",correcta:!0,resultado:"Recuperas flujo pulsátil. Gran parte del intestino recobra color en minutos.",deltaEstabilidad:5,deltaEstres:3},{texto:"Resecar de entrada todo el intestino de aspecto isquémico sin revascularizar",correcta:!1,resultado:"Resecas intestino potencialmente recuperable y condenas al paciente a un intestino corto.",deltaEstabilidad:-20,deltaEstres:12}]},{titulo:"Tras la revascularización",evento:"Persiste un segmento de íleon de 30 cm claramente necrótico.",opciones:[{texto:"Resección limitada del segmento necrótico",correcta:!0,resultado:"Resecas solo lo irrecuperable, preservando la máxima longitud intestinal.",deltaEstabilidad:0,deltaEstres:-2},{texto:'Dejarlo: "con el flujo recuperado, quizá remonte"',correcta:!1,resultado:"El intestino necrótico no resucita: sepsis postoperatoria grave.",deltaEstabilidad:-25,deltaEstres:15}]},{titulo:"Cierre y planificación",evento:"Quedan zonas de viabilidad intermedia. El paciente tolera mal la cirugía prolongada.",opciones:[{texto:"Cirugía de control de daños: abdomen abierto (vacuum) y second-look programado en 24-48 h",correcta:!0,resultado:"Estrategia correcta: reevaluarás la viabilidad con el paciente reanimado.",deltaEstabilidad:0,deltaEstres:-3},{texto:"Anastomosis definitiva y cierre completo de pared en el mismo acto",correcta:!1,resultado:"Sin second-look, la progresión de la isquemia pasará desapercibida.",deltaEstabilidad:-15,deltaEstres:8}]}]}},{id:"trauma",cie10:"S36.032A",nombre:"Trauma abdominal cerrado (lesión esplénica)",quirurgica:!0,frecuencia:5,vitalInmediato:!0,presentacion:{sintomas:["Accidente de motocicleta a alta velocidad hace 40 minutos","Dolor en hipocondrio izquierdo irradiado al hombro (signo de Kehr)","Mareo y sudoración fría en el traslado"],exploracion:"Palidez mucocutánea. Dolor y defensa en hipocondrio izquierdo. Huella del manillar en la pared abdominal.",constantes:"TA 88/55, FC 128, Sat 95%, Tª 36,2 °C — ¡hipotenso y taquicárdico!"},pruebaDiana:"ecofast",hallazgoDiana:"Eco-FAST: líquido libre abundante en espacio esplenorrenal y pelvis. Paciente inestable: indicación de laparotomía urgente sin más pruebas.",hallazgosParciales:{analitica:"Hb 8,9 g/dL en descenso. Esperar la analítica en un inestable es perder tiempo.",tc:"El paciente se hipotensa en la mesa del TC: trasladar a un inestable al escáner es una decisión peligrosa."},deterioroPorHora:15,estabilidadInicial:[40,55],manejoCorrecto:"cirugia",notaDocente:'En el trauma abdominal con inestabilidad hemodinámica, la eco-FAST positiva indica laparotomía inmediata. El TC es para pacientes estables; "la muerte comienza en radiología".',cirugia:{nombre:"Laparotomía exploradora por trauma",duracionMin:100,pasos:[{titulo:"Entrada y control inicial",evento:"Hemoperitoneo masivo al abrir. No se identifica el origen de entrada.",opciones:[{texto:"Empaquetamiento sistemático de los cuatro cuadrantes y aspirado ordenado",correcta:!0,resultado:"El packing controla temporalmente el sangrado. Identificas el bazo como origen.",deltaEstabilidad:5,deltaEstres:3},{texto:"Aspirar y buscar el origen directamente sin empaquetar",correcta:!1,resultado:"Pierdes minutos preciosos entre sangre: el paciente se hipotensa aún más.",deltaEstabilidad:-18,deltaEstres:12}]},{titulo:"Lesión esplénica grado IV",evento:"Bazo estallado con sangrado activo del hilio. El paciente sigue inestable.",opciones:[{texto:"Esplenectomía: control del hilio y extirpación",correcta:!0,resultado:"Hemostasia definitiva. En el inestable no se intenta preservar el bazo.",deltaEstabilidad:5,deltaEstres:-2},{texto:"Intentar esplenorrafia con mallas y agentes hemostáticos para preservar el bazo",correcta:!1,resultado:"Media hora de intentos fallidos con el paciente exanguinándose. Acabas haciendo la esplenectomía igualmente.",deltaEstabilidad:-20,deltaEstres:14}]},{titulo:"Fin de la intervención",evento:"Anestesia informa: pH 7,21, temperatura 34,8 °C, coagulopatía en las pruebas viscoelásticas. La tríada letal acecha.",opciones:[{texto:"Cirugía de control de daños: revisión rápida, packing si precisa y cierre temporal",correcta:!0,resultado:"Cortas la espiral de la tríada letal. A REA a recalentar, corregir y reanimar.",deltaEstabilidad:0,deltaEstres:-3},{texto:'Revisión exhaustiva prolongada y cierre definitivo por planos "para no reintervenir"',correcta:!1,resultado:"Una hora más de quirófano en hipotermia y coagulopatía: el paciente lo paga caro.",deltaEstabilidad:-18,deltaEstres:10}]}]}},{id:"ulcus",cie10:"K27.1",nombre:"Ulcus péptico perforado",quirurgica:!0,frecuencia:5,presentacion:{sintomas:["Dolor epigástrico brutal de inicio súbito hace 2 h, «como una puñalada»","El dolor se ha generalizado a todo el abdomen","Antecedente de epigastralgia crónica automedicada con ibuprofeno"],exploracion:"Abdomen en tabla con contractura generalizada. El paciente evita moverse. Matidez hepática dudosa.",constantes:"TA 115/75, FC 104, Sat 97%, Tª 37,4 °C"},pruebaDiana:"tc",hallazgoDiana:"TC: neumoperitoneo evidente subdiafragmático y periportal, líquido libre y engrosamiento de la región antropilórica. Perforación de víscera hueca: ulcus péptico perforado.",hallazgosParciales:{rxtorax:"Rx tórax en bipedestación: media luna de aire libre subdiafragmático bilateral. Víscera hueca perforada; el TC precisará el origen.",analitica:"Leucocitosis 15.600 con neutrofilia. Amilasa discretamente elevada (el líquido gástrico libre la sube).",eco:"Ecografía: líquido libre perihepático. El gas dificulta el resto del estudio."},deterioroPorHora:8,estabilidadInicial:[55,75],manejoCorrecto:"cirugia",notaDocente:"El «abdomen en tabla» con inicio súbito y antecedente de AINEs es un ulcus perforado hasta que se demuestre lo contrario. La sutura simple con epiploplastia de Graham resuelve la urgencia; la enfermedad ulcerosa se trata después con IBP y erradicación de H. pylori.",cirugia:{nombre:"Cierre de perforación + epiploplastia de Graham",duracionMin:95,pasos:[{titulo:"Exploración y control de la contaminación",evento:"Peritonitis química con restos alimentarios. Identificas una perforación de 8 mm en cara anterior prepilórica.",opciones:[{texto:"Aspirado y lavado abundante por cuadrantes antes de reparar",correcta:!0,resultado:"Cavidad limpia. La perforación queda bien expuesta para la reparación.",deltaEstabilidad:0,deltaEstres:-2},{texto:"Suturar inmediatamente en el campo sucio: «primero cerrar el grifo»",correcta:!1,resultado:"Trabajas mal, con restos que ocultan los bordes. La carga séptica sigue dentro.",deltaEstabilidad:-10,deltaEstres:8}]},{titulo:"Reparación de la perforación",evento:"Los bordes de la úlcera están edematosos y friables.",opciones:[{texto:"Puntos sueltos sin tensión y parche de epiplón (Graham) sobre la sutura",correcta:!0,resultado:"Cierre sellado con epiplón bien vascularizado. Prueba de fuga negativa.",deltaEstabilidad:0,deltaEstres:-2},{texto:"Sutura simple a tensión sin parche, «para acabar antes»",correcta:!1,resultado:"Los puntos desgarran el tejido friable: alto riesgo de fuga postoperatoria.",deltaEstabilidad:-14,deltaEstres:10},{texto:"Antrectomía urgente para «resolverlo de raíz»",correcta:!1,resultado:"Cirugía mayor innecesaria en un paciente séptico: más tiempo, más sangrado, más riesgo.",deltaEstabilidad:-16,deltaEstres:8}]},{titulo:"Antes de cerrar",evento:"Los bordes de la úlcera te parecen indurados, algo irregulares. ¿Malignidad subyacente?",opciones:[{texto:"Tomar biopsias de los bordes y dejarlo registrado para el estudio diferido",correcta:!0,resultado:"Biopsias tomadas sin comprometer el cierre. Si es un tumor, no se escapará.",deltaEstabilidad:0,deltaEstres:-2},{texto:"Ignorarlo: «las úlceras son benignas casi siempre»",correcta:!1,resultado:"Si era un adenocarcinoma, acabas de retrasar su diagnóstico meses.",deltaEstabilidad:-6,deltaEstres:4}]}]}},{id:"hernia",cie10:"K40.40",nombre:"Hernia inguinal incarcerada (estrangulada)",quirurgica:!0,frecuencia:6,presentacion:{sintomas:["Bulto inguinal derecho doloroso e irreductible desde hace 10 h","Náuseas y dolor abdominal cólico creciente","La hernia «se le salía» desde hace años y siempre volvía a entrar"],exploracion:"Masa inguinal derecha dura, muy dolorosa, irreductible, con piel eritematosa. Dolor abdominal difuso con distensión leve.",constantes:"TA 120/78, FC 102, Sat 97%, Tª 37,9 °C"},pruebaDiana:"eco",hallazgoDiana:"Ecografía de pared: saco herniario inguinal con asa de delgado incarcerada, aperistáltica, con líquido en el saco y engrosamiento parietal. Signos de sufrimiento de asa: hernia estrangulada.",hallazgosParciales:{analitica:"Leucocitosis 14.900. Lactato 2,4 mmol/L: empieza a sufrir el asa.",tc:"TC: hernia inguinal con asa incarcerada y cambios inflamatorios. La ecografía habría bastado."},deterioroPorHora:6,estabilidadInicial:[60,80],manejoCorrecto:"cirugia",notaDocente:"Una hernia incarcerada dolorosa con signos inflamatorios no se reduce a la fuerza en urgencias: puede devolverse al abdomen un asa necrótica («reducción en masa»). Es quirófano urgente con valoración de viabilidad del contenido.",cirugia:{nombre:"Herniorrafia urgente con revisión del contenido",duracionMin:85,pasos:[{titulo:"Apertura del saco herniario",evento:"Al abrir el saco sale líquido oscuro y aparece un asa violácea. El asa amenaza con escurrirse hacia el abdomen.",opciones:[{texto:"Sujetar el asa con una gasa antes de abrir el anillo: nada vuelve al abdomen sin ser valorado",correcta:!0,resultado:"Asa controlada y expuesta. Podrás decidir su viabilidad con calma.",deltaEstabilidad:0,deltaEstres:-2},{texto:"Reducir el contenido inmediatamente al abdomen y reparar la pared",correcta:!1,resultado:"El asa dudosa desaparece en la cavidad sin valorar: si estaba necrótica, la has escondido.",deltaEstabilidad:-18,deltaEstres:12}]},{titulo:"Liberación del anillo",evento:"El anillo herniario es estrecho y fibroso: el asa no sale ni entra.",opciones:[{texto:"Kelotomía: ampliar el anillo con sección controlada, protegiendo asa y vasos epigástricos",correcta:!0,resultado:"Anillo ampliado sin lesionar nada. El asa queda liberada.",deltaEstabilidad:0,deltaEstres:-2},{texto:"Tracción forzada del asa a través del anillo estrecho",correcta:!1,resultado:"Desgarro del asa a nivel del anillo con salida de contenido intestinal.",deltaEstabilidad:-16,deltaEstres:12}]},{titulo:"Viabilidad y reparación",evento:"Tras liberar el asa y reevaluarla con suero caliente, un segmento corto sigue necrótico. Hay contaminación del campo.",opciones:[{texto:"Resección segmentaria, anastomosis y reparación anatómica SIN malla (campo contaminado)",correcta:!0,resultado:"Resuelves la urgencia sin dejar prótesis en un campo sucio. Reparación tipo Bassini/Shouldice.",deltaEstabilidad:0,deltaEstres:-2},{texto:"Resección y colocación de malla de polipropileno «para que no recidive»",correcta:!1,resultado:"Prótesis en campo contaminado: infección protésica casi garantizada, con reintervención futura.",deltaEstabilidad:-12,deltaEstres:8},{texto:"No resecar el segmento necrótico para acortar la cirugía",correcta:!1,resultado:"Intestino muerto dentro del abdomen: peritonitis en 24-48 h.",deltaEstabilidad:-22,deltaEstres:14}]}]}},{id:"neumotorax",cie10:"S27.0XXA",nombre:"Neumotórax a tensión",quirurgica:!0,frecuencia:4,vitalInmediato:!0,presentacion:{sintomas:["Costalada contra el bordillo con la bici hace una hora","Disnea que empeora por minutos; habla entrecortado","Dolor torácico derecho punzante que aumenta al respirar"],exploracion:"Hipofonesis franca en hemitórax derecho con timpanismo; ingurgitación yugular; tráquea desviada a la izquierda. Se está apagando delante de ti.",constantes:"TA 84/50, FC 132, Sat 84%, Tª 36,4 °C — ¡hipotenso, taquicárdico y desaturando!"},pruebaDiana:"ecofast",hallazgoDiana:"Eco torácica a pie de cama: ausencia de deslizamiento pleural derecho con punto pulmonar. Neumotórax a tensión: esto se drena YA, sin esperar a más imagen.",hallazgosParciales:{rxtorax:"Rx tórax: pulmón derecho colapsado con desviación mediastínica contralateral. Si has esperado a la placa para creértelo, has tenido suerte.",analitica:"Pedir analítica a un neumotórax a tensión es una forma educada de perder al paciente.",tc:"El TC confirmaría... si el paciente llegara vivo al escáner. La clínica ya te lo ha dicho todo.",ecg:"ECG: taquicardia sinusal con bajos voltajes derechos. Compatible, pero la clínica manda."},deterioroPorHora:20,estabilidadInicial:[35,50],manejoCorrecto:"cirugia",notaDocente:"El neumotórax a tensión es un diagnóstico CLÍNICO: hipofonesis + timpanismo + yugulares + shock. Se descomprime de inmediato (aguja en 2º espacio o dedo-drenaje en 5º) antes que cualquier prueba de imagen.",cirugia:{nombre:"Descompresión torácica + drenaje",duracionMin:40,pasos:[{titulo:"Descompresión inmediata",evento:"El paciente se hipotensa más. La aguja o el dedo: algo tiene que entrar en ese tórax ahora.",opciones:[{texto:"Toracostomía con el dedo en 5º espacio, línea axilar media: aire que silba y TA que remonta",correcta:!0,resultado:"El sifón de aire confirma el diagnóstico. La tensión cede y las yugulares se vacían.",deltaEstabilidad:12,deltaEstres:3},{texto:"Esperar al TC para confirmar antes de agujerear a nadie",correcta:!1,resultado:"Camino del escáner el paciente entra en disociación electromecánica. Vuelves corriendo.",deltaEstabilidad:-22,deltaEstres:15}]},{titulo:"Colocación del drenaje",evento:"Toca el tubo torácico definitivo. El espacio pleural está a tu merced... y el paquete intercostal también.",opciones:[{texto:"Disección roma SOBRE el borde superior de la costilla inferior y tubo dirigido a vértice",correcta:!0,resultado:"El tubo burbujea y oscila. El pulmón vuelve a su sitio en la placa.",deltaEstabilidad:5,deltaEstres:-2},{texto:'Trocar a ciegas con empuje firme: "siempre ha funcionado"',correcta:!1,resultado:"El trocar sin control es el instrumento con más órganos en su currículum. Sangrado intercostal.",deltaEstabilidad:-14,deltaEstres:10}]},{titulo:"Comprobación final",evento:"El drenaje burbujea de forma continua y masiva, más de lo esperado.",opciones:[{texto:"Sospechar lesión traqueobronquial: fijar el tubo, oxígeno y avisar a torácica para fibrobroncoscopia",correcta:!0,resultado:"Fuga aérea masiva bien encaminada: esto ya es asunto de cirugía torácica, y lo has visto a tiempo.",deltaEstabilidad:0,deltaEstres:2},{texto:'Pinzar el drenaje "para que no pierda tanto aire"',correcta:!1,resultado:"Pinzar un drenaje que fuga es reconstruir el neumotórax a tensión con tus propias manos.",deltaEstabilidad:-18,deltaEstres:12}]}]}},{id:"ectopico",cie10:"O00.90",nombre:"Embarazo ectópico accidentado",quirurgica:!0,frecuencia:4,presentacion:{sintomas:["Dolor brusco en fosa ilíaca izquierda de 3 h de evolución","Mareo al levantarse y un pequeño manchado oscuro","Última regla «hará unas siete semanas, con lo del trabajo ni lo pensé»"],exploracion:"Pálida y sudorosa. Dolor anexial izquierdo intenso con defensa localizada. Cérvix doloroso a la movilización.",constantes:"TA 92/58, FC 112, Sat 98%, Tª 36,7 °C"},pruebaDiana:"eco",hallazgoDiana:"Ecografía: útero vacío con endometrio engrosado, masa anexial izquierda de 3 cm y abundante líquido libre ecogénico (hemoperitoneo). Embarazo ectópico accidentado.",hallazgosParciales:{orina:"Test de gestación POSITIVO. Dolor anexial + amenorrea + test positivo: el ectópico manda hasta verlo.",analitica:"Hb 9,6 g/dL en descenso. Leucocitos normales. Está sangrando dentro."},deterioroPorHora:10,estabilidadInicial:[45,62],manejoCorrecto:"cirugia",notaDocente:"Toda mujer en edad fértil con dolor abdominal y síncope es un ectópico accidentado hasta que el test de gestación diga lo contrario. Roto e inestable: laparoscopia urgente, sin esperar a la beta-hCG cuantitativa.",cirugia:{nombre:"Salpingectomía laparoscópica urgente",duracionMin:70,pasos:[{titulo:"Entrada y evaluación del hemoperitoneo",evento:"Al entrar la cámara, sangre libre en pelvis que impide ver el origen.",opciones:[{texto:"Aspirar el hemoperitoneo por cuadrantes y exponer el anejo con suavidad",correcta:!0,resultado:"Campo despejado: trompa izquierda rota con sangrado activo del borde.",deltaEstabilidad:0,deltaEstres:-2},{texto:"Coagular a ciegas donde parece sangrar, sin aspirar primero",correcta:!1,resultado:"Quemas mesosálpinx sano y el sangrado sigue. Pierdes minutos y campo.",deltaEstabilidad:-12,deltaEstres:10}]},{titulo:"Control del sangrado",evento:"La trompa está rota en su tercio medio y sangra de forma pulsátil.",opciones:[{texto:"Salpingectomía reglada con sellador/bipolar, de proximal a distal",correcta:!0,resultado:"Trompa extirpada con hemostasia limpia. El sangrado cede.",deltaEstabilidad:5,deltaEstres:-2},{texto:"Intentar salpingostomía conservadora en la trompa reventada",correcta:!1,resultado:"En una trompa rota y sangrante no hay nada que conservar: resangra y acabas resecando igual.",deltaEstabilidad:-14,deltaEstres:10}]},{titulo:"Revisión final",evento:"Hemostasia aparente. Queda decidir cómo cierras la intervención.",opciones:[{texto:"Lavado, revisar anejo contralateral y comprobar hemostasia bajando la presión del neumo",correcta:!0,resultado:"Pelvis limpia, contralateral sano, sin resangrado con presión baja. Cierre.",deltaEstabilidad:0,deltaEstres:-3},{texto:"Cerrar directamente: «ya no sangra, no toquemos más»",correcta:!1,resultado:"Sin bajar la presión, un vaso retraído queda dormido... y despierta en REA.",deltaEstabilidad:-10,deltaEstres:6}]}]}},{id:"absceso",cie10:"K61.0",nombre:"Absceso perianal",quirurgica:!0,frecuencia:5,presentacion:{sintomas:["Dolor anal continuo y pulsátil de 72 h, que no deja ni sentarse","Fiebre de 38,2 °C desde anoche","«Pensé que eran almorranas, pero esto es otra cosa, doctor»"],exploracion:"Tumefacción perianal derecha eritematosa, caliente y fluctuante, exquisitamente dolorosa. No crepita. Tacto rectal imposible por dolor.",constantes:"TA 128/80, FC 96, Sat 98%, Tª 38,2 °C"},pruebaDiana:"eco",hallazgoDiana:"Eco de partes blandas: colección hipoecoica de 4 cm con detritus en margen anal derecho, sin gas en planos profundos. Absceso perianal establecido.",hallazgosParciales:{analitica:"Leucocitosis 13.900 con neutrofilia. PCR 90 mg/L. Glucemia 108 (no diabético conocido: apúntalo igualmente)."},deterioroPorHora:3,estabilidadInicial:[68,85],manejoCorrecto:"cirugia",notaDocente:"Un absceso no se cura con antibiótico: se cura drenándolo. La exploración ya es diagnóstica cuando fluctúa; la eco ayuda si dudas. Y en el diabético, piensa siempre en Fournier antes de irte a casa.",cirugia:{nombre:"Drenaje de absceso perianal",duracionMin:35,pasos:[{titulo:"Incisión y drenaje",evento:"Bajo anestesia, la zona fluctúa a tensión. Bisturí en mano.",opciones:[{texto:"Incisión amplia sobre el punto de máxima fluctuación, lo más cerca del margen anal",correcta:!0,resultado:"Sale pus a tensión con alivio inmediato. Cavidad desbridada con el dedo.",deltaEstabilidad:5,deltaEstres:-2},{texto:"Punción-aspiración con aguja gruesa «para no dejar cicatriz»",correcta:!1,resultado:"La cavidad se rellena en horas: el absceso puncionado y no drenado siempre vuelve.",deltaEstabilidad:-8,deltaEstres:6}]},{titulo:"Cierre de la intervención",evento:"Cavidad limpia y desbridada. ¿Cómo la dejas?",opciones:[{texto:"Herida ABIERTA con mecha, para cierre por segunda intención",correcta:!0,resultado:"Drenaje asegurado. Curas diarias y a vigilar el trayecto fistuloso en consulta.",deltaEstabilidad:0,deltaEstres:-2},{texto:"Sutura de la piel por primera intención, «que quede bonito»",correcta:!1,resultado:"Cerrar un absceso es fabricar el siguiente. Recidiva precoz garantizada.",deltaEstabilidad:-10,deltaEstres:6}]}]}},{id:"tce",cie10:"S06.4X1A",nombre:"TCE con hematoma epidural",quirurgica:!1,frecuencia:4,presentacion:{sintomas:["Caída de un andamio hace 3 h con golpe temporal derecho",'Perdió el conocimiento, se recuperó "perfectamente"... y ahora está cada vez más torpe',"Cefalea creciente y un vómito en la sala de espera"],exploracion:"Somnoliento, Glasgow 13 y bajando. Pupila derecha perezosa. Hematoma en cuero cabelludo temporal derecho. El intervalo lúcido de los libros, delante de ti.",constantes:"TA 158/92, FC 52, Sat 97%, Tª 36,6 °C"},pruebaDiana:"tccraneo",hallazgoDiana:"TC craneal: colección hiperdensa biconvexa temporal derecha con efecto masa y desviación de línea media. Hematoma epidural: esto es neurocirugía URGENTE.",hallazgosParciales:{analitica:"Coagulación normal. La analítica no descarta nada dentro del cráneo.",ecg:"Bradicardia sinusal. Con esa TA en ascenso: reflejo de Cushing en marcha."},deterioroPorHora:14,estabilidadInicial:[45,60],manejoCorrecto:"conservador",notaDocente:"Intervalo lúcido + deterioro + anisocoria = hematoma epidural hasta que el TC diga otra cosa. El tratamiento es craneotomía urgente por NEUROCIRUGÍA: en un centro sin ella, la derivación inmediata es el acto quirúrgico más importante de la noche."},{id:"iam",cie10:"I21.19",nombre:"IAM inferior (disfrazado de abdomen)",quirurgica:!1,frecuencia:5,presentacion:{sintomas:['Dolor "de estómago" opresivo de 2 h, con náuseas y un vómito','Sudoración fría que él atribuye a "algo que ha cenado"','Fumador, hipertenso, y con un hermano "operado del corazón"'],exploracion:"Epigastrio apenas doloroso a la palpación profunda, sin defensa. Pálido, sudoroso, mal aspecto general que no cuadra con la tripa.",constantes:"TA 98/62, FC 58, Sat 96%, Tª 36,2 °C"},pruebaDiana:"ecg",hallazgoDiana:'ECG: elevación del ST en II, III y aVF. Infarto agudo de cara inferior: el "dolor de estómago" era el corazón. Activa el código infarto.',hallazgosParciales:{analitica:"Troponina en curso... pero el ECG tarda 10 minutos y no espera a nadie.",eco:"Abdomen anodino. A veces la mejor ecografía abdominal es la que te hace mirar más arriba.",tc:"TC abdominal normal. Irradiar el abdomen equivocado no diagnostica el tórax correcto."},deterioroPorHora:12,estabilidadInicial:[50,65],manejoCorrecto:"conservador",notaDocente:"El IAM inferior debuta como epigastralgia con cortejo vegetativo y bradicardia. Todo dolor epigástrico de perfil raro merece un ECG de 10 minutos ANTES que un TC de 60. El tratamiento es reperfusión urgente (hemodinámica), no bisturí."},{id:"cad",cie10:"E10.10",nombre:"Cetoacidosis diabética (abdomen agudo... que no lo es)",quirurgica:!1,frecuencia:4,presentacion:{sintomas:["Dolor abdominal difuso e intenso de 12 h con vómitos","Sed insaciable y micciones continuas estos días",'Diabético tipo 1 "con la insulina un poco abandonada" tras un catarro'],exploracion:"Abdomen doloroso de forma difusa pero depresible, sin verdadera defensa. Respiración profunda y rápida; aliento afrutado inconfundible. Deshidratado.",constantes:"TA 102/64, FC 118, Sat 98%, Tª 37,1 °C — ¡taquicárdico!"},pruebaDiana:"analitica",hallazgoDiana:"Analítica: glucemia 486 mg/dL, pH 7,12, bicarbonato 9, cetonemia intensa. Cetoacidosis diabética: el abdomen duele, pero el problema es metabólico.",hallazgosParciales:{gasometria:"Gasometría: pH 7,14, bicarbonato 10, anión gap elevado. Acidosis metabólica grave: esto se trata en la cama, no en la mesa.",tc:"TC abdominal sin hallazgos. La CAD imita el abdomen quirúrgico y se ríe de los escáneres.",ecg:"Taquicardia sinusal con ondas T algo picudas: vigila ese potasio durante el tratamiento."},deterioroPorHora:8,estabilidadInicial:[50,68],manejoCorrecto:"conservador",notaDocente:"La cetoacidosis diabética produce dolor abdominal intenso que imita un abdomen agudo — y operarla puede ser mortal. Kussmaul + aliento cetósico + glucemia disparada: fluidos, insulina y potasio. El bisturí, enfundado."},{id:"pancreatitis",cie10:"K85.10",nombre:"Pancreatitis aguda litiásica",quirurgica:!1,frecuencia:6,presentacion:{sintomas:["Dolor epigástrico intenso irradiado «en cinturón» a la espalda, de 10 h","Vómitos repetidos que no alivian el dolor","Colelitiasis conocida pendiente de cirugía programada"],exploracion:"Dolor a la palpación epigástrica sin peritonismo franco. Distensión leve. Ruidos disminuidos.",constantes:"TA 118/72, FC 100, Sat 96%, Tª 37,5 °C"},pruebaDiana:"analitica",hallazgoDiana:"Analítica: lipasa 1.850 U/L (>3 veces el límite) y amilasa 1.200 U/L. Perfil hepático con patrón de colestasis leve. Pancreatitis aguda de origen biliar.",hallazgosParciales:{eco:"Ecografía: colelitiasis múltiple sin signos de colecistitis. Vía biliar de 7 mm. Páncreas mal visualizado por gas.",tc:"TC precoz: edema peripancreático. Recuerda: el TC precoz no cambia el manejo inicial; la clínica y la lipasa dan el diagnóstico."},deterioroPorHora:3,estabilidadInicial:[65,85],manejoCorrecto:"conservador",notaDocente:"La pancreatitis aguda NO se opera en fase aguda: el tratamiento es ingreso, fluidoterapia, analgesia y nutrición precoz. La colecistectomía se hace diferida en el mismo ingreso una vez resuelto el cuadro. Operar el páncreas inflamado de urgencia es un error clásico."},{id:"volvulo",cie10:"K56.2",nombre:"Vólvulo de sigma (sin isquemia)",quirurgica:!1,frecuencia:4,presentacion:{sintomas:["Traído de la residencia por distensión abdominal enorme de 24 h","No hace deposición ni expulsa gases desde ayer","Episodios parecidos «que se le pasaban solos», según la hoja de enfermería"],exploracion:"Abdomen muy distendido y timpánico, molesto pero SIN defensa ni peritonismo. Ampolla rectal vacía.",constantes:"TA 132/78, FC 88, Sat 96%, Tª 36,9 °C"},pruebaDiana:"tc",hallazgoDiana:"TC: sigma masivamente dilatado con imagen «en grano de café» y remolino mesentérico. Pared con realce conservado, sin neumatosis ni líquido libre. Vólvulo de sigma NO complicado.",hallazgosParciales:{analitica:"Sin leucocitosis, lactato 1,3 mmol/L. Nada grita isquemia... de momento.",eco:"Ecografía: asas muy dilatadas con gas que impide todo lo demás."},deterioroPorHora:5,estabilidadInicial:[58,76],manejoCorrecto:"conservador",notaDocente:"El vólvulo de sigma sin signos de isquemia se DEVOLVULA POR ENDOSCOPIA (y la sigmoidectomía se programa después, porque recidiva). Abrir de urgencia un vólvulo viable es sobretratar; dejarlo pasar hasta que se necrose, infratratar. El arte está en el medio."},{id:"pielonefritis",cie10:"N10",nombre:"Pielonefritis aguda",quirurgica:!1,frecuencia:5,presentacion:{sintomas:["Fiebre de 39,2 °C con tiritona franca desde hace 12 h","Dolor lumbar derecho continuo","Escozor al orinar desde hace tres días que trató «bebiendo mucha agua»"],exploracion:"Afectada, febril. Puñopercusión renal derecha claramente positiva. Abdomen blando, sin defensa.",constantes:"TA 108/66, FC 104, Sat 98%, Tª 39,2 °C"},pruebaDiana:"orina",hallazgoDiana:"Sedimento: piuria intensa, nitritos positivos y bacteriuria abundante. Con fiebre, tiritona y puñopercusión positiva: pielonefritis aguda.",hallazgosParciales:{analitica:"Leucocitosis 15.800 con neutrofilia. PCR 180 mg/L. Función renal conservada.",eco:"Ecografía: riñón derecho discretamente aumentado SIN dilatación de la vía. Dato clave: no hay obstrucción."},deterioroPorHora:4,estabilidadInicial:[60,80],manejoCorrecto:"conservador",notaDocente:"La pielonefritis se trata con antibiótico y sueros, no con bisturí — pero exige una eco que descarte obstrucción: una pielonefritis obstruida es una urgencia urológica que hay que drenar. Fiebre + puñopercusión + piuria: ingresa, cultiva y trata."},{id:"colico_renal",cie10:"N23",nombre:"Cólico renoureteral",quirurgica:!1,frecuencia:5,presentacion:{sintomas:["Dolor lumbar derecho intensísimo irradiado a genitales, de inicio brusco","El paciente no encuentra post
